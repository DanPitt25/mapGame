<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World War Map</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/topojson.v3.min.js"></script>
</head>
<body>
    <div id="app">
        <header id="header">
            <h1>World War Map</h1>
            <div id="controls">
                <button id="zoom-in" title="Zoom In">+</button>
                <button id="zoom-out" title="Zoom Out">−</button>
                <button id="reset-view" title="Reset View">⌂</button>
            </div>
        </header>

        <main id="map-container">
            <svg id="map"></svg>
        </main>

        <aside id="info-panel">
            <h2 id="province-name">Select a Province</h2>
            <div id="province-details">
                <p>Click on any province to see details</p>
            </div>
        </aside>

        <footer id="footer">
            <div id="coordinates"></div>
            <div id="zoom-level">Zoom: 1x</div>
        </footer>
    </div>

    <script src="js/provinces.js?v=2"></script>
    <script src="js/map.js?v=2"></script>
    <script src="js/app.js?v=2"></script>
</body>
</html>
